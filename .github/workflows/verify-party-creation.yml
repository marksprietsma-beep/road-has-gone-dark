name: Verify Party and Production Expedition Native Distribution
permissions:
  contents: read
on:
  push:
    branches: [main, feature/game-84-first-production-expedition-v0]
    paths: ['scripts/**', 'scenes/**', 'tools/**', 'tests/**', 'data/**', 'assets/**', 'themes/**', 'export_presets.cfg', 'project.godot', '.github/workflows/verify-party-creation.yml']
  pull_request:
    paths:
      - 'scripts/**'
      - 'tools/**'
      - 'data/world_enrichment/**'
      - 'tests/**'
      - 'export_presets.cfg'
      - '.github/workflows/verify-party-creation.yml'
  workflow_dispatch:
jobs:
  party:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen build dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Prepare verified Godot and the single native offline helper
        run: python tests/world_library/prepare-ci.py
      - name: Linux party, five fresh worlds, input/render and regressions
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 3840x2160x24' python tests/expedition/run-tests.py --visual --regressions
      - name: Windows native party, five fresh worlds, persistence and regressions
        if: runner.os == 'Windows'
        run: python tests/expedition/run-tests.py --regressions
      - name: Install checksum-verified native export templates
        run: python tools/release/prepare-templates.py
      - name: Export, test and archive the complete native game and matching helper
        env:
          GAME84_RELEASE_ROOT: ${{ runner.temp }}/game84-distributions
        run: python tests/expedition/verify-package.py
      - name: Upload executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game84-qa-${{ runner.os }}
          path: docs/implementation/game84
      - name: Upload complete native distribution and checksum
        uses: actions/upload-artifact@v4
        with:
          name: game84-complete-${{ runner.os }}
          path: |
            ${{ runner.temp }}/game84-distributions/*.zip
            ${{ runner.temp }}/game84-distributions/*.tar.gz
            ${{ runner.temp }}/game84-distributions/*.sha256
