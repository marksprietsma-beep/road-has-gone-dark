name: Publish preserved GAME-62 bundle (handoff only)

on:
  push:
    branches:
      - handoff/game-62-local-region-upload
    paths:
      - handoffs/GAME-62/GAME-62-source.bundle

permissions:
  contents: write

jobs:
  restore-exact-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and publish original Git commit (never merge)
        shell: bash
        run: |
          set -euo pipefail
          bundle="handoffs/GAME-62/GAME-62-source.bundle"
          base="3c06cf81e46c7ce9edd4e9ebf20a9940c0ca6f23"
          expected="0c15fcc77011d5dd1ca5418cbc67be1cee576360"
          test -s "$bundle"
          git cat-file -e "$base^{commit}"
          git bundle verify "$bundle"
          git fetch "$bundle" "refs/heads/codex/game-62-local-region-v1"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$base" "$actual"
          git push origin "$actual:refs/heads/game-62-preserved-original"
          echo "Published original GAME-62 commit $actual to game-62-preserved-original."
          echo "No pull request was created and nothing was merged."
