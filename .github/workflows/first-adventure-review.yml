name: Production Sandbox Windows Review Build
permissions:
  contents: read
on:
  push:
    branches: [main, fix/game-99-azgaar-geography, integration/game-97-production-consolidation, feature/first-adventure-vertical-slice, feature/game-94-lpc-character-presentation, feature/game-95-party-preview-old-road, feature/game-96-procedural-sandbox-spine]
    paths: ['tools/worldgen/**', 'tools/expedition/**', 'tests/geography_repair/**', 'data/world_enrichment/runtime-expedition-v1.json', 'data/sandbox/**', 'tests/sandbox/**', 'assets/combat/**', 'data/art/**', 'data/combat/**', 'tests/battlefields/**', 'export_presets.cfg', 'tests/lpc/**', 'tests/art/**', 'scripts/**', 'scenes/**', 'tests/adventure/**', 'tools/release/**', '.github/workflows/first-adventure-review.yml']
  workflow_dispatch:
jobs:
  windows-review:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen build dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified engine and compatible Windows offline helper
        run: python tests/world_library/prepare-ci.py
      - name: Combat and campaign checkpoint regressions
        run: python tests/adventure/run-tests.py --godot "$env:GODOT_BIN" --work-dir "$env:RUNNER_TEMP/adventure-source-tests"
      - name: Original source integrity and separate-process visual preference
        run: python tests/art/run-tests.py --godot "$env:GODOT_BIN" --output "$env:RUNNER_TEMP/game95-art-tests"
      - name: GAME-32 frozen deterministic rules and migration regressions
        env:
          GAME32_EVIDENCE: ${{ runner.temp }}/game95-rules
        run: python tests/rules/run-tests.py
      - name: GAME-83 production presentation contract
        run: '& $env:GODOT_BIN --headless --audio-driver Dummy --path . --script tests/ui_system/presentation.gd'
      - name: Native LPC animation and presentation isolation
        env:
          GAME94_LPC_ROOT: ${{ runner.temp }}/game95-live-lpc
        run: '& $env:GODOT_BIN --headless --audio-driver Dummy --path . --script tests/lpc/review.gd'
      - name: Party preview, registered maps and independent GAME-94 command oracle
        env:
          GAME95_REVIEW_ROOT: ${{ runner.temp }}/game95-live-road
        run: '& $env:GODOT_BIN --headless --audio-driver Dummy --path . --script tests/battlefields/review.gd'
      - name: Multi-world generated maps, unchanged command oracle and multi-opportunity restart
        run: python tests/sandbox/run-tests.py --godot "$env:GODOT_BIN" --output "$env:RUNNER_TEMP/game96-sandbox"
      - name: GAME-99 real failing source and original-to-repaired native campaign recovery
        run: |
          node tests/geography_repair/world.mjs game96-sandbox-review-v2 "$env:RUNNER_TEMP/game99-native/corpus/game96-sandbox-review-v2"
          python tests/geography_repair/run-recovery.py --output "$env:RUNNER_TEMP/game99-native/recovery"
      - name: Verify official release export templates
        run: python tools/release/prepare-templates.py
      - name: Export Windows x64 and verify fresh-profile full player path with empty PATH
        env:
          ADVENTURE_RELEASE_ROOT: ${{ runner.temp }}/first-adventure-review
          GAME96_RELEASE: 1
          GAME99_RELEASE: 1
          GAME99_OLD_CAMPAIGN: ${{ runner.temp }}/game99-native/recovery/exported-blocked-campaign
        run: python tests/adventure/verify-review-package.py
      - name: Native proof and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game99-windows-evidence
          path: |
            ${{ runner.temp }}/first-adventure-review/evidence
            ${{ runner.temp }}/adventure-source-tests/*.log
            ${{ runner.temp }}/adventure-source-tests/results.json
            ${{ runner.temp }}/game95-art-tests
            ${{ runner.temp }}/game95-rules
            ${{ runner.temp }}/game95-live-lpc
            ${{ runner.temp }}/game95-live-road
            ${{ runner.temp }}/game96-sandbox
            ${{ runner.temp }}/game99-native/recovery/*.log
            ${{ runner.temp }}/game99-native/recovery/results.json
            ${{ runner.temp }}/game99-native/corpus/game96-sandbox-review-v2/result.json
          if-no-files-found: error
      - name: Playable Windows x64 review package
        uses: actions/upload-artifact@v4
        with:
          name: game99-windows-x64
          path: |
            ${{ runner.temp }}/first-adventure-review/*.zip
            ${{ runner.temp }}/first-adventure-review/*.sha256
          if-no-files-found: error
          retention-days: 30
