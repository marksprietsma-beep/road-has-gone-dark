name: GAME-93 Four Art Styles Windows Review Build
permissions:
  contents: read
on:
  push:
    branches: [feature/first-adventure-vertical-slice, feature/game-93-four-sprite-styles]
    paths: ['assets/combat/**', 'data/art/**', 'tests/art/**', 'scripts/**', 'scenes/**', 'tests/adventure/**', 'tools/release/**', '.github/workflows/first-adventure-review.yml']
  workflow_dispatch:
jobs:
  windows-review:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen build dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified engine and compatible Windows offline helper
        run: python tests/world_library/prepare-ci.py
      - name: Combat and campaign checkpoint regressions
        run: python tests/adventure/run-tests.py --godot "$env:GODOT_BIN" --work-dir "$env:RUNNER_TEMP/adventure-source-tests"
      - name: Original source integrity and separate-process visual preference
        run: python tests/art/run-tests.py --godot "$env:GODOT_BIN" --output "$env:RUNNER_TEMP/game93-art-tests"
      - name: GAME-32 frozen deterministic rules and migration regressions
        env:
          GAME32_EVIDENCE: ${{ runner.temp }}/game93-rules
        run: python tests/rules/run-tests.py
      - name: GAME-83 production presentation contract
        run: '& $env:GODOT_BIN --headless --audio-driver Dummy --path . --script tests/ui_system/presentation.gd'
      - name: Verify official release export templates
        run: python tools/release/prepare-templates.py
      - name: Export Windows x64 and verify fresh-profile full player path with empty PATH
        env:
          ADVENTURE_RELEASE_ROOT: ${{ runner.temp }}/first-adventure-review
        run: python tests/adventure/verify-review-package.py
      - name: Native proof and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game93-windows-evidence
          path: |
            ${{ runner.temp }}/first-adventure-review/evidence
            ${{ runner.temp }}/adventure-source-tests/*.log
            ${{ runner.temp }}/adventure-source-tests/results.json
            ${{ runner.temp }}/game93-art-tests
            ${{ runner.temp }}/game93-rules
          if-no-files-found: error
      - name: Playable Windows x64 review package
        uses: actions/upload-artifact@v4
        with:
          name: game93-windows-x64
          path: |
            ${{ runner.temp }}/first-adventure-review/*.zip
            ${{ runner.temp }}/first-adventure-review/*.sha256
          if-no-files-found: error
          retention-days: 30
