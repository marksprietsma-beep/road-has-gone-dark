name: GAME-121 Sustainable Adventures and Earned Prestige
concurrency:
  group: game121-adventures-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
on:
  push:
    branches: [feature/game-121-sustainable-adventures]
    paths: ['scripts/**', 'tools/**', 'tests/opportunities/**', 'tests/character_builder/**', 'tests/character_content/**', 'tests/character_core/**', 'tests/character_progression/**', 'tests/adventure_cycles/**', 'data/rules/**', 'data/characters/**', 'data/sandbox/**', 'data/world_enrichment/runtime-expedition-v1.json', 'export_presets.cfg', '.github/workflows/verify-adventure-cycles.yml']
  workflow_dispatch:
jobs:
  opportunities:
    env:
      GAME119_TEST_ROOT: ${{ github.workspace }}/game119-evidence
      GAME_CHARACTER_REVIEW_TAG: game119-deep-character-progression
      GAME_CHARACTER_REVIEW_SCENE: res://tests/character_progression/review.tscn
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen generator dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified Godot and single offline helper
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node-only dependency examples from Godot imports
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Ten generated worlds, forty contexts, V1/V2 save reliability and production journeys
        env:
          GAME101_TEST_ROOT: ${{ runner.temp }}/game101-review
        run: python tests/opportunities/run-tests.py --output "${{ runner.temp }}/game101-review"
      - name: Installed pins, complete coverage and twenty-level new-class combinations
        run: |
          python tools/character-content/validate.py
          python -c "import os,subprocess; subprocess.run([os.environ['GODOT_BIN'],'--headless','--audio-driver','Dummy','--path','.','--script','tests/character_content/packs.gd'],check=True)"
      - name: Familiar character matrix and genuine tactical powers through level eight
        env:
          GAME118_TEST_ROOT: ${{ runner.temp }}/game118-core
        run: |
          python tests/character_core/run-tests.py
      - name: Durable choices, level-twelve powers and attainable prestige combat
        run: python tests/character_progression/run-tests.py
      - name: Frozen GAME-32 oracle and existing-save migration
        env:
          GAME32_EVIDENCE: ${{ runner.temp }}/game118-rules
        run: python tests/rules/run-tests.py
      - name: Custom builds, illegal choices, combat snapshots and earned legacy advancement
        env:
          GAME103_TEST_ROOT: ${{ runner.temp }}/game103-lifecycle
        run: python tests/character_builder/run-tests.py
      - name: Atomic fresh creator and interruption-safe default pin
        env:
          GAME103_TEST_ROOT: ${{ runner.temp }}/game103-lifecycle
          GAME118_TEST_ROOT: ${{ runner.temp }}/game118-core
        run: python tests/character_core/run-tests.py --atomic
      - name: Existing First Adventure combat and save regression
        run: python tests/adventure/run-tests.py --godot "${{ env.GODOT_BIN }}" --work-dir "${{ runner.temp }}/game101-adventure"
      - name: Existing GAME-83 responsive presentation
        run: python -c "import os,subprocess; subprocess.run([os.environ['GODOT_BIN'],'--headless','--audio-driver','Dummy','--path','.','--script','tests/ui_system/presentation.gd'],check=True)"
      - name: Earned prestige, contextual cycles and atomic objective rewards
        env:
          GAME121_TEST_ROOT: ${{ runner.temp }}/game121-source
        run: python tests/adventure_cycles/run-tests.py --output "${{ runner.temp }}/game121-source"
      - name: Verified export templates
        run: python tools/release/prepare-templates.py
      - name: Export native V1/V2 journeys with bundled helper and original artwork
        env:
          GAME101_TEST_ROOT: ${{ runner.temp }}/game101-review
        run: python tests/character_core/verify-package.py
      - name: Self-contained native earned prestige and restart package
        env:
          GAME121_TEST_ROOT: ${{ runner.temp }}/game121-native
        run: python tests/adventure_cycles/verify-package.py
      - name: Earned progression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game121-earned-evidence-${{ runner.os }}
          path: |
            ${{ runner.temp }}/game121-source/**/*.json
            ${{ runner.temp }}/game121-source/**/*.log
            ${{ runner.temp }}/game121-native/**/*.json
            ${{ runner.temp }}/game121-native/*.log
          retention-days: 90
      - name: Complete sustainable adventure game
        uses: actions/upload-artifact@v4
        with:
          name: game121-complete-${{ runner.os }}
          path: ${{ runner.temp }}/game121-native/distribution/*.${{ runner.os == 'Windows' && 'zip*' || 'tar.gz*' }}
          retention-days: 90
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game121-parent-evidence-${{ runner.os }}
          path: |
            ${{ runner.temp }}/game101-review/*.json
            ${{ runner.temp }}/game101-review/*.log
            ${{ runner.temp }}/game101-review/corpus/*.json
            ${{ runner.temp }}/game101-review/lifecycle/*.json
            ${{ runner.temp }}/game101-review/v1-lifecycle/*.json
            ${{ runner.temp }}/game101-adventure/*.json
            ${{ runner.temp }}/game101-adventure/*.log
            ${{ runner.temp }}/game118-rules/*.json
            ${{ runner.temp }}/game118-rules/*.log
            ${{ runner.temp }}/game103-lifecycle/*.json
            ${{ runner.temp }}/game103-lifecycle/*.log
            ${{ runner.temp }}/game118-core/*.json
            ${{ runner.temp }}/game118-core/*.log
            ${{ github.workspace }}/game119-evidence/*.json
            ${{ github.workspace }}/game119-evidence/*.log
          retention-days: 90
      - name: Windows complete playable distribution
        uses: actions/upload-artifact@v4
        with:
          name: game121-parent-complete-${{ runner.os }}
          path: |
            ${{ runner.temp }}/game101-review/distribution/*.zip
            ${{ runner.temp }}/game101-review/distribution/*.tar.gz
            ${{ runner.temp }}/game101-review/distribution/*.sha256
          retention-days: 90
