name: Verify GameWorld save foundation
on:
  pull_request:
    paths:
      - "scripts/game_world/**"
      - "tests/game_world/**"
      - "docs/implementation/**"
      - ".github/workflows/verify-game-world.yml"
  workflow_dispatch:

jobs:
  gameworld-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned canonical fixture hashes
        shell: pwsh
        run: |
          $expected = @{
            "tests/worldgen/fixtures/game-11-determinism.json" = "2eb428e783101dc1c99213c31816dbd50f3a68370094917949a88bfbb5811fa5"
            "tests/worldgen/fixtures/atlas-showcase.json" = "9f942b07bb73c2af17c4039d009561b696864e02ec67f2e8dd3a5ef6a757ebb3"
          }
          foreach ($file in $expected.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$file]) { throw "Pinned fixture hash mismatch: $file" }
          }
      - name: Prepare verified Windows Godot and helper
        run: |
          npm ci --ignore-scripts --prefix vendor/azgaar
          python tests/world_library/prepare-ci.py
      - name: Import Godot project
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed" }
      - name: Windows GameWorld smoke and strict error checks
        shell: pwsh
        run: |
          $log = (& $env:GODOT_BIN --headless --path . --quit-after 240 --script res://tests/game_world/smoke-game-world.gd 2>&1 | Out-String)
          $log
          if ($LASTEXITCODE -ne 0 -or $log -notmatch "PASS: GAME-7" -or $log -match "SCRIPT ERROR|Parse Error|Unicode parsing error|Unexpected NUL character|Assertion failed|ERROR:") { throw "GameWorld smoke failed" }
      - name: Confirm fixtures remain unchanged
        run: git diff --exit-code -- tests/worldgen/fixtures vendor/azgaar
