name: Verify local source neighbourhoods
on:
  pull_request:
    paths:
      - "tools/regiongen/local-source-context.mjs"
      - "tools/regiongen/preview-local-context.mjs"
      - "tools/regiongen/generate-local-examples.mjs"
      - "tests/regiongen/verify-local-context.mjs"
      - "tools/regiongen/compose-local-region.mjs"
      - "tools/regiongen/render-constrained-region.mjs"
      - "tools/regiongen/generate-constrained-region.mjs"
      - "tools/regiongen/generate-constrained-examples.mjs"
      - "tests/regiongen/verify-constrained-region.mjs"
      - "scripts/debug/constrained_region_preview.gd"
      - "scenes/debug/constrained_region_preview.tscn"
      - "tests/regiongen/smoke-constrained-preview.gd"
      - ".github/workflows/verify-local-source-context.yml"
      - "docs/implementation/GAME-46*"
  workflow_dispatch:
jobs:
  neighbourhood:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned upstream generator dependencies
        run: npm ci --prefix vendor/azgaar --ignore-scripts --no-audit --no-fund
      - name: Rebuild source geometry from unchanged Azgaar seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/regiongen/.tmp
          node tools/worldgen/generate-azgaar.mjs --seed game-11-determinism --output tools/regiongen/.tmp/local-replayed-first.json --geometry-output tools/regiongen/.tmp/geography-game-11-determinism.json
          node tools/worldgen/generate-azgaar.mjs --seed atlas-showcase-06 --output tools/regiongen/.tmp/local-replayed-second.json --geometry-output tools/regiongen/.tmp/geography-atlas-showcase.json
          cmp tests/worldgen/fixtures/game-11-determinism.json tools/regiongen/.tmp/local-replayed-first.json
          cmp tests/worldgen/fixtures/atlas-showcase.json tools/regiongen/.tmp/local-replayed-second.json
      - name: Verify source neighbourhoods, IDs and constraints
        run: node tests/regiongen/verify-local-context.mjs
      - name: Generate six real-source local views
        run: node tools/regiongen/generate-local-examples.mjs
      - name: Generate six source-constrained Town Forge vegetation scenes
        run: node tools/regiongen/generate-constrained-examples.mjs
      - name: Verify original routes, coastline, dry land and river corridors
        run: node tests/regiongen/verify-constrained-region.mjs
      - name: Install Godot 4.7.2 for constrained-viewer smoke
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and inspect six authentic constrained Godot maps
        run: |
          set -euo pipefail
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee /tmp/import-constrained.log
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/regiongen/smoke-constrained-preview.gd 2>&1 | tee /tmp/smoke-constrained.log
          grep -q "PASS: GAME-47 Godot" /tmp/smoke-constrained.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Unicode parsing error|Unexpected NUL character|Assertion failed|ERROR:' /tmp/smoke-constrained.log; then
            echo "Godot emitted a constrained preview error"; exit 1
          fi
      - name: Guard immutable fixtures and pinned vendors
        run: git diff --exit-code -- tests/worldgen/fixtures vendor/azgaar vendor/town-forge
      - name: Upload six maps and deterministic source JSON
        uses: actions/upload-artifact@v4
        with:
          name: game-46-source-constrained-neighbourhoods
          path: |
            tools/regiongen/.tmp/local-*.svg
            tools/regiongen/.tmp/local-*.json
            tools/regiongen/.tmp/constrained-*.json
            tools/regiongen/.tmp/constrained-*.svg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
