name: GAME-152 Psychic Resource Parity
on:
  push:
    branches: [feature/game-152-psychic-resource-parity, main]
    paths: ['tests/psychic_parity/**', '.github/workflows/verify-psychic-parity.yml']
  pull_request:
    paths: ['tests/psychic_parity/**', '.github/workflows/verify-psychic-parity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified Windows engine
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node examples
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Checked class import
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --import 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/game152-import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os;from pathlib import Path;s=Path(os.environ['RUNNER_TEMP'],'game152-import.log').read_text(encoding='utf-8-sig');assert 'SCRIPT ERROR:'not in s and 'Parse Error:'not in s"
      - name: Frozen baseline reproductions before versioned correction
        env:
          GAME152_ROOT: ${{ runner.temp }}/game152-focused
        run: python tests/psychic_parity/run-tests.py
      - name: Preserve exact Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game152-focused-windows
          path: |
            ${{ runner.temp }}/game152-focused/*
            ${{ runner.temp }}/game152-import.log
          retention-days: 90
