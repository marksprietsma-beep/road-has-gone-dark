name: Verify source authority boundaries
on:
  pull_request:
    paths:
      - "tools/regiongen/source-authority.mjs"
      - "tools/regiongen/inferred-fine-terrain.mjs"
      - "tools/regiongen/render-inferred-fine.mjs"
      - "tools/regiongen/generate-inferred-fine-examples.mjs"
      - "tests/regiongen/verify-inferred-fine.mjs"
      - "tools/regiongen/generate-authority-examples.mjs"
      - "tests/regiongen/verify-source-authority.mjs"
      - "scripts/debug/source_authority_preview.gd"
      - "scenes/debug/source_authority_preview.tscn"
      - "tests/regiongen/smoke-source-authority.gd"
      - ".github/workflows/verify-source-authority.yml"
      - "docs/implementation/GAME-49*"
  workflow_dispatch:
jobs:
  macro-vs-fine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned Azgaar dependencies
        run: npm ci --prefix vendor/azgaar --ignore-scripts --no-audit --no-fund
      - name: Regenerate canonical source and original polygon vertex sidecars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/regiongen/.tmp
          node tools/worldgen/generate-azgaar.mjs --seed game-11-determinism --output tools/regiongen/.tmp/replay-first-authority.json --geometry-output tools/regiongen/.tmp/geography-game-11-determinism.json
          node tools/worldgen/generate-azgaar.mjs --seed atlas-showcase-06 --output tools/regiongen/.tmp/replay-second-authority.json --geometry-output tools/regiongen/.tmp/geography-atlas-showcase.json
          cmp tests/worldgen/fixtures/game-11-determinism.json tools/regiongen/.tmp/replay-first-authority.json
          cmp tests/worldgen/fixtures/atlas-showcase.json tools/regiongen/.tmp/replay-second-authority.json
      - name: Generate six original neighbourhoods
        run: node tools/regiongen/generate-local-examples.mjs
      - name: Generate six hypothetical 30 km comparisons
        run: node tools/regiongen/generate-reference-examples.mjs
      - name: Test source and inferred truth contract against two worlds
        run: node tests/regiongen/verify-source-authority.mjs
      - name: Show exactly what source can and cannot establish
        run: node tools/regiongen/generate-authority-examples.mjs
      - name: Build six optional inferred local relief and forest maps
        run: |
          node tools/regiongen/generate-inferred-fine-examples.mjs
          node tests/regiongen/verify-inferred-fine.mjs
      - name: Parse all six full-size source authority SVGs as real XML
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = glob.glob('tools/regiongen/.tmp/authority-*.svg') + glob.glob('tools/regiongen/.tmp/fine-*.svg')
          assert len(paths) == 12, f'Expected twelve source and inference SVGs, got {len(paths)}'
          for path in paths:
              ET.parse(path)
          print('PASS: GAME-49/51 six valid source and six inferred SVG images')
          PY
      - name: Download Godot 4.7.2 for explicit source-authority preview validation
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot-authority.zip
          unzip -q /tmp/godot-authority.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and test six actual source-authority Godot maps
        run: |
          set -euo pipefail
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee /tmp/import-authority.log
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/regiongen/smoke-source-authority.gd 2>&1 | tee /tmp/smoke-authority.log
          grep -q "PASS: GAME-49 Godot" /tmp/smoke-authority.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Unicode parsing error|Unexpected NUL character|Assertion failed|ERROR:' /tmp/smoke-authority.log; then
            echo "Godot emitted a source authority parsing or validation error"; exit 1
          fi
      - name: Guard immutable source and vendor files
        run: git diff --exit-code -- tests/worldgen/fixtures vendor/azgaar vendor/town-forge
      - name: Upload six explicit authority JSONs and original-source diagnostic maps
        uses: actions/upload-artifact@v4
        with:
          name: game-49-source-authority-evidence
          path: |
            tools/regiongen/.tmp/authority-*.json
            tools/regiongen/.tmp/authority-*.svg
            tools/regiongen/.tmp/fine-*.json
            tools/regiongen/.tmp/fine-*.svg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
