name: Verify Content Enrichment
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'research/game77/**'
      - '.github/workflows/verify-content-enrichment.yml'
  workflow_dispatch:
jobs:
  enrichment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked existing generator build dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Prepare accepted Godot and same native GAME-76 helper
        run: python tests/world_library/prepare-ci.py
      - name: Windows offline enrichment and existing persistence/library regressions
        if: runner.os == 'Windows'
        run: python research/game77/tools/run-qa.py --helper-contract
      - name: Linux offline enrichment, regressions and actual render/input flow
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 3840x2160x24' python research/game77/tools/run-qa.py --visual --helper-contract
      - name: Upload actual platform QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game77-qa-${{ runner.os }}
          path: research/game77/evidence
