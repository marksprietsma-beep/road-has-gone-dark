name: Mystic Theurge and Abjurant Champion Acceptance
on:
  workflow_dispatch:
    inputs:
      presentation:
        description: Fresh captures from successful exact-source-guarded earned evidence
        type: boolean
        default: false
      earned_run:
        description: Successful earned run for presentation only
        type: string
        default: ''
      release:
        description: One stable self-contained native Windows release with fresh earned640XP
        type: boolean
        default: false
      journey:
        description: Genuine640XP/9 source campaign, actual entry/decline and two connected cold forks
        type: boolean
        default: false
  push:
    branches: [main, feature/game-123-theurge-abjurant-acceptance]
    paths: ['scripts/**', 'data/rules/**', 'tests/dual_prestige_acceptance/**', '.github/workflows/verify-dual-prestige.yml']
  pull_request:
    paths: ['scripts/**', 'data/rules/**', 'tests/dual_prestige_acceptance/**', '.github/workflows/verify-dual-prestige.yml']
permissions:
  contents: read
  actions: read
jobs:
  focused-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified Windows engine
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node examples
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Exact historical packs and bounded candidate29
        run: |
          python tests/hybrid_acceptance/check-source.py
          python tests/dual_prestige_acceptance/check-source.py
      - name: Checked Godot import
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --import 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/dual-import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os;from pathlib import Path;s=Path(os.environ['RUNNER_TEMP'],'dual-import.log').read_text(encoding='utf-8-sig');assert 'SCRIPT ERROR:'not in s and 'Parse Error:'not in s"
      - name: Pinned/current mechanics, exact cold restart and actual controls
        env:
          DUAL_ROOT: ${{ runner.temp }}/dual-focused
        run: python tests/dual_prestige_acceptance/run-focused.py
      - name: Genuine earned campaign, manual prestige and connected cold continuation
        if: github.event_name == 'workflow_dispatch' && inputs.journey
        env:
          DUAL_JOURNEY_ROOT: ${{ runner.temp }}/dual-earned
        run: python tests/dual_prestige_acceptance/run-journey.py
      - name: Verify successful earned evidence source
        if: github.event_name == 'workflow_dispatch' && inputs.presentation
        uses: actions/github-script@v7
        env:
          REQUESTED_EARNED_RUN: ${{ inputs.earned_run }}
        with:
          script: |
            const id = Number(process.env.REQUESTED_EARNED_RUN);
            if (!Number.isSafeInteger(id) || id <= 0) throw Error('Successful earned run required');
            const {data} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:id});
            if (data.status !== 'completed' || data.conclusion !== 'success') throw Error('Earned run must have succeeded');
            core.exportVariable('DUAL_EARNED_RUN',String(id));
            core.exportVariable('DUAL_EARNED_SOURCE',data.head_sha);
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.presentation
        with:
          name: dual-prestige-windows-evidence
          run-id: ${{ inputs.earned_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/dual-presentation-input
      - name: Actual source-guarded Windows Godot captures
        if: github.event_name == 'workflow_dispatch' && inputs.presentation
        env:
          DUAL_PRESENTATION_ROOT: ${{ runner.temp }}/dual-presentation
          DUAL_PRESENTATION_INPUT: ${{ runner.temp }}/dual-presentation-input
        run: python tests/dual_prestige_acceptance/recheck-presentation.py
      - name: Verified Windows export templates
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: python tools/release/prepare-templates.py
      - name: Complete self-contained native Windows acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          DUAL_RELEASE_ROOT: ${{ runner.temp }}/dual-native
        run: python tests/dual_prestige_acceptance/verify-package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-prestige-windows-evidence
          path: |
            ${{ runner.temp }}/dual-focused/**
            ${{ runner.temp }}/dual-earned/**
            ${{ runner.temp }}/dual-presentation/**/*.json
            ${{ runner.temp }}/dual-presentation/**/*.log
            ${{ runner.temp }}/dual-presentation/captures/*.png
            ${{ runner.temp }}/dual-native/**/*.json
            ${{ runner.temp }}/dual-native/**/*.log
            ${{ runner.temp }}/dual-native/captures/*.png
            ${{ runner.temp }}/dual-import.log
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: dual-prestige-complete-windows-x64
          path: ${{ runner.temp }}/dual-native/distribution/*.zip*
          retention-days: 90
