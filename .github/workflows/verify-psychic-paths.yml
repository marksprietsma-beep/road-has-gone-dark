name: GAME-127 Advanced Psychic Paths
on:
  workflow_dispatch:
    inputs:
      journey:
        description: Genuine earned total10 paths, original campaign combat and cold restart
        type: boolean
        default: false
  pull_request:
    paths: ['scripts/**', 'data/rules/**', 'tests/psychic_paths/**', '.github/workflows/verify-psychic-paths.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'data/rules/**', 'tests/psychic_paths/**', '.github/workflows/verify-psychic-paths.yml']
permissions:
  contents: read
jobs:
  focused-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified Windows engine
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node examples
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Checked Godot import
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --import 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/psychic-paths-import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os;from pathlib import Path;s=Path(os.environ['RUNNER_TEMP'],'psychic-paths-import.log').read_text(encoding='utf-8-sig');assert 'SCRIPT ERROR:'not in s and 'Parse Error:'not in s"
      - name: Frozen pins and current path mechanics with exact cold continuation
        env:
          GAME127_PATH_ROOT: ${{ runner.temp }}/psychic-paths-focused
          GAME127_PATH_JOURNEY: ${{ inputs.journey && '1' || '0' }}
        run: python tests/psychic_paths/run-focused.py
      - name: Preserve exact Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychic-paths-focused-windows
          path: |
            ${{ runner.temp }}/psychic-paths-focused/**
            ${{ runner.temp }}/psychic-paths-import.log
          retention-days: 90
