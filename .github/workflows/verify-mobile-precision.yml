name: GAME-146 Mobile Precision
on:
  push:
    branches: [feature/game-146-mobile-precision, main]
    paths: ['scripts/**', 'data/rules/**', 'tests/mobile_precision/**', '.github/workflows/verify-mobile-precision.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game146-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified native engine and helper
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node examples
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Checked class cache import
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --import 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/game146-import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os;from pathlib import Path;s=Path(os.environ['RUNNER_TEMP'],'game146-import.log').read_text(encoding='utf-8-sig');assert 'SCRIPT ERROR:'not in s and 'Parse Error:'not in s"
      - name: Actual confirmed-hit, precision, equipment and cold tests
        env:
          GAME146_ROOT: ${{ runner.temp }}/game146-focused
        run: python tests/mobile_precision/run-tests.py
      - name: Exact historical source and negative projection guards
        run: python tests/adventure_cycles/pin_guard_test.py
      - name: Preserve exact focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game146-focused-windows-evidence
          path: |
            ${{ runner.temp }}/game146-focused/*.json
            ${{ runner.temp }}/game146-focused/*.log
            ${{ runner.temp }}/game146-*.log
          retention-days: 90
