name: Verify landmark inspection
on:
  pull_request:
    paths:
      - "scripts/debug/map_renderer/landmark_layer.gd"
      - "scripts/debug/world_fixture_renderer.gd"
      - "scripts/debug/world_fixture_viewer.gd"
      - "scenes/debug/world_fixture_viewer.tscn"
      - "tests/worldgen/smoke-landmark-inspection.gd"
      - ".github/workflows/verify-landmark-inspection.yml"
  workflow_dispatch:

jobs:
  inspection-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import Godot project
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Test landmark inspection, secrecy and zoom behaviour
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/worldgen/smoke-landmark-inspection.gd
