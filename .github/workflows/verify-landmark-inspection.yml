name: Verify landmark inspection
on:
  pull_request:
    paths:
      - "scripts/debug/map_renderer/landmark_layer.gd"
      - "scripts/debug/map_renderer/settlement_layer.gd"
      - "scripts/debug/map_renderer/map_world_text.gd"
      - "scripts/debug/map_landmark_key.gd"
      - "scripts/debug/world_fixture_renderer.gd"
      - "scripts/debug/world_fixture_viewer.gd"
      - "scenes/debug/world_fixture_viewer.tscn"
      - "tests/worldgen/smoke-landmark-inspection.gd"
      - ".github/workflows/verify-landmark-inspection.yml"
  workflow_dispatch:

jobs:
  inspection-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6.3-stable_linux.x86_64
      - name: Import Godot project
        run: /tmp/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Test inspection and reject Unicode parsing warnings
        run: |
          set -euo pipefail
          /tmp/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/worldgen/smoke-landmark-inspection.gd 2>&1 | tee /tmp/inspection.log
          if grep -Ei 'Unicode parsing error|Unexpected NUL character' /tmp/inspection.log; then
            echo "Godot emitted an unexpected Unicode parse warning."
            exit 1
          fi
