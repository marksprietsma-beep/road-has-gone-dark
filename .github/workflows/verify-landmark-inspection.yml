name: Verify landmark inspection
on:
  pull_request:
    paths:
      - "scripts/debug/map_renderer/landmark_layer.gd"
      - "scripts/debug/map_renderer/settlement_layer.gd"
      - "scripts/debug/map_renderer/map_world_text.gd"
      - "scripts/debug/map_landmark_key.gd"
      - "scripts/debug/world_fixture_renderer.gd"
      - "scripts/debug/world_fixture_viewer.gd"
      - "scenes/debug/world_fixture_viewer.tscn"
      - "tests/worldgen/smoke-landmark-inspection.gd"
      - ".github/workflows/verify-landmark-inspection.yml"
  workflow_dispatch:

jobs:
  inspection-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified Windows Godot
        run: |
          npm ci --ignore-scripts --prefix vendor/azgaar
          python tests/world_library/prepare-ci.py
      - name: Import Godot project
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test landmark inspection and reject Unicode parsing warnings
        shell: pwsh
        run: |
          $log = (& $env:GODOT_BIN --headless --path . --script res://tests/worldgen/smoke-landmark-inspection.gd 2>&1 | Out-String)
          $log
          if ($LASTEXITCODE -ne 0 -or $log -match "Unicode parsing error|Unexpected NUL character|SCRIPT ERROR|Parse Error") { throw "Landmark smoke failed" }
