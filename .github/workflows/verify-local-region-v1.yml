name: Verify Local Region Generator V1
on:
  pull_request:
    paths: ['tools/regiongen/**', 'tools/worldgen/**', 'vendor/town-forge/**', 'scripts/debug/*region*.gd', 'scenes/debug/*region*.tscn', 'tests/regiongen/**', 'docs/implementation/GAME-62*', '.github/workflows/verify-local-region-v1.yml']
  workflow_dispatch:
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generation dependencies
        run: npm ci --prefix vendor/azgaar --ignore-scripts --no-audit --no-fund
      - name: Generate immutable-world one-cell proofs
        shell: pwsh
        run: |
          node tests/regiongen/verify-pins.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tools/regiongen/prove-generator-v1.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tests/regiongen/verify-v1.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tests/regiongen/verify-source-projection.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tests/regiongen/verify-geography-sidecar.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --test tests/worldgen/canonical-json.test.mjs tests/worldgen/relief-sidecar.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --exit-code -- tests/worldgen/fixtures vendor/azgaar
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Prepare native Windows Godot
        run: python tests/world_library/prepare-ci.py
      - name: Verify viewer, saves and rendered pixels on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force review/local-region-v1 | Out-Null
          & $env:GODOT_BIN --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot project import failed" }
          & $env:GODOT_BIN --headless --path . --script res://tests/regiongen/smoke-v1.gd
          if ($LASTEXITCODE -ne 0) { throw "Region smoke failed" }
          & $env:GODOT_BIN --headless --path . --script res://tests/game_world/smoke-game-world.gd
          if ($LASTEXITCODE -ne 0) { throw "GameWorld smoke failed" }
          & $env:GODOT_BIN --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/regiongen/capture-v1.gd
          if ($LASTEXITCODE -ne 0) { throw "Region capture failed" }
          & $env:GODOT_BIN --audio-driver Dummy --path . --rendering-method gl_compatibility --script res://tests/regiongen/capture-v1.gd -- --verify-render
          if ($LASTEXITCODE -ne 0) { throw "Region render-repeat verification failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-region-v1-windows-developer-review
          path: review/local-region-v1/
          if-no-files-found: warn
