name: Verify GAME-83 Production UI and Native Distribution
permissions:
  contents: read
on:
  push:
    branches: [main, feature/game-83-production-ui-system-refactor]
    paths: ['scripts/**', 'scenes/**', 'themes/**', 'tests/**', 'tools/**', '.github/workflows/verify-production-ui.yml']
  pull_request:
    paths: ['scripts/ui/**', 'scripts/expedition/expedition_map.gd', 'scenes/ui/**', 'themes/**', 'tests/ui_system/**', '.github/workflows/verify-production-ui.yml']
  workflow_dispatch:
jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Godot and compatible offline helper
        run: python tests/world_library/prepare-ci.py
      - name: Linux input, rendering and complete foundation regressions
        if: runner.os == 'Linux'
        env:
          GAME97_EVIDENCE_ROOT: docs/implementation/game83/logs/capture-failures
        run: |
          xvfb-run -a python tests/expedition/verify-capture-failures.py
          xvfb-run -a -s '-screen 0 3840x2160x24' python tests/ui_system/run-tests.py --visual --regressions
      - name: Windows source and complete foundation regressions
        if: runner.os == 'Windows'
        run: python tests/ui_system/run-tests.py --regressions
      - name: Verified export templates
        run: python tools/release/prepare-templates.py
      - name: Complete native build and empty-PATH expedition proof
        env:
          GAME84_RELEASE_ROOT: ${{ runner.temp }}/game83-distributions
          GAME_RELEASE_TAG: game83
          GAME_RELEASE_EVIDENCE: docs/implementation/game83
        run: python tests/expedition/verify-package.py
      - name: Review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game83-qa-${{ runner.os }}
          path: docs/implementation/game83
      - name: Complete game and matching helper
        uses: actions/upload-artifact@v4
        with:
          name: game83-complete-${{ runner.os }}
          path: |
            ${{ runner.temp }}/game83-distributions/*.zip
            ${{ runner.temp }}/game83-distributions/*.tar.gz
            ${{ runner.temp }}/game83-distributions/*.sha256
