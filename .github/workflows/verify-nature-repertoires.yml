name: GAME-133 Sorcerer and Druid Repertoires
concurrency:
  group: game133-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
on:
  push:
    branches: [feature/game-133-sorcerer-druid-repertoires, main]
    paths: ['scripts/**', 'data/rules/**', 'tools/**', 'tests/nature_repertoires/**', '.github/workflows/verify-nature-repertoires.yml']
  workflow_dispatch:
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen world generator dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified engine and bundled helper
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node-only examples
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Verified export templates
        run: python tools/release/prepare-templates.py
      - name: Exact immutable packs and research ledger
        run: python tools/character-content/validate.py
      - name: Historical v1-v17 bytes and pins
        run: python tools/character-content/check-historical-packs.py
      - name: Prepare production Godot class cache
        shell: pwsh
        run: '& $env:GODOT_BIN --headless --editor --path . --import'
      - name: Native spells, earned careers, legacy compatibility, cold restart and real Godot captures
        env:
          GAME133_ROOT: ${{ runner.temp }}/game133-native
        run: python tests/nature_repertoires/verify-package.py
      - name: Complete Windows game
        uses: actions/upload-artifact@v4
        with:
          name: game133-complete-windows-x64
          path: ${{ runner.temp }}/game133-native/distribution/*.zip*
          retention-days: 90
      - name: Native evidence and Godot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game133-native-evidence
          path: |
            ${{ runner.temp }}/game133-native/**/*.json
            ${{ runner.temp }}/game133-native/**/*.log
            ${{ runner.temp }}/game133-native/captures/*.png
          retention-days: 90
