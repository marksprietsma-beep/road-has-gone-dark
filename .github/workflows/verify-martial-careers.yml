name: Fighter and Barbarian Acceptance
on:
  workflow_dispatch:
    inputs:
      release:
        description: Complete self-contained native Windows acceptance after focused verification
        type: boolean
        default: false
  push:
    branches: [main, feature/game-123-fighter-barbarian-acceptance]
    paths: ['scripts/**', 'data/rules/**', 'tests/martial_careers/**', '.github/workflows/verify-martial-careers.yml']
  pull_request:
    paths: ['scripts/**', 'data/rules/**', 'tests/martial_careers/**', '.github/workflows/verify-martial-careers.yml']
permissions:
  contents: read
jobs:
  focused-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified Windows engine
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node examples
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Immutable content and reviewed source scope
        run: |
          python tools/character-content/validate.py
          python tests/martial_careers/check-source.py
          python tests/dual_prestige_acceptance/check-source.py
      - name: Checked engine import
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --import 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/martial-import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os;from pathlib import Path;s=Path(os.environ['RUNNER_TEMP'],'martial-import.log').read_text(encoding='utf-8-sig');assert 'SCRIPT ERROR:'not in s and 'Parse Error:'not in s"
      - name: Pinned reproduction and focused mechanics
        env:
          MARTIAL_ROOT: ${{ runner.temp }}/martial-focused
        run: python tests/martial_careers/run-focused.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: martial-careers-windows-evidence
          path: |
            ${{ runner.temp }}/martial-focused/**
            ${{ runner.temp }}/martial-import.log
          retention-days: 90
