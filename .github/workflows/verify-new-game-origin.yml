name: Verify New Game origin
on:
  pull_request:
    paths:
      - 'scripts/ui/**'
      - 'scenes/ui/**'
      - 'scripts/game_world/**'
      - 'assets/onboarding/**'
      - 'tests/onboarding/**'
      - '.github/workflows/verify-new-game-origin.yml'
  workflow_dispatch:
jobs:
  onboarding:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified Windows Godot and offline helper
        run: |
          npm ci --ignore-scripts --prefix vendor/azgaar
          python tests/world_library/prepare-ci.py
      - name: Verify new game source, input and persistence on Windows
        run: python tests/onboarding/run-tests.py
      - name: Upload actual run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game74-windows-godot-evidence
          path: |
            docs/implementation/game74/logs
            docs/implementation/game74/screenshots
            docs/implementation/game74/persistence-proof.json
          if-no-files-found: warn
