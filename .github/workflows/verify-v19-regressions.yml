name: GAME-144 Focused v19 Regressions
on:
  push:
    branches: [fix/game-144-v19-regressions, main]
    paths: ['tests/v19_regressions/**', 'tests/character_catalogue/**', 'tests/nature_repertoires/capture_driver.gd', 'tests/opportunities/corpus.gd', '.github/workflows/verify-v19-regressions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game144-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified native engine and helper
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node examples
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Checked class cache import
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --import 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/game144-import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os;from pathlib import Path;s=Path(os.environ['RUNNER_TEMP'],'game144-import.log').read_text(encoding='utf-8-sig');assert 'SCRIPT ERROR:'not in s and 'Parse Error:'not in s"
      - name: Actual stale-adapter and mixed-pin reproductions
        env:
          GAME144_ROOT: ${{ runner.temp }}/game144-focused
        run: python tests/v19_regressions/run-tests.py
      - name: Exact historical source and negative projection guards
        run: python tests/adventure_cycles/pin_guard_test.py
      - name: Preserve exact focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game144-focused-windows-evidence
          path: |
            ${{ runner.temp }}/game144-focused/*.json
            ${{ runner.temp }}/game144-focused/*.log
            ${{ runner.temp }}/game144-*.log
          retention-days: 90
