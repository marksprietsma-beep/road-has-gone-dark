name: Sorcerer and Druid Upper-Tier Acceptance
on:
  workflow_dispatch:
    inputs:
      release:
        description: Complete self-contained Windows release after focused acceptance
        type: boolean
        default: false
  push:
    branches: [main, feature/game-123-sorcerer-druid-upper-tiers]
    paths: ['scripts/**', 'data/rules/**', 'tests/upper_nature/**', '.github/workflows/verify-upper-nature.yml']
  pull_request:
    paths: ['scripts/**', 'data/rules/**', 'tests/upper_nature/**', '.github/workflows/verify-upper-nature.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen generator dependencies
        run: npm ci --ignore-scripts --prefix vendor/azgaar
      - name: Verified Windows engine
        run: python tests/world_library/prepare-ci.py
      - name: Exclude Node examples
        run: python -c "from pathlib import Path; Path('vendor/azgaar/node_modules/.gdignore').touch()"
      - name: Checked Godot import
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --path . --import 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/upper-nature-import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os;from pathlib import Path;s=Path(os.environ['RUNNER_TEMP'],'upper-nature-import.log').read_text(encoding='utf-8-sig');assert 'SCRIPT ERROR:'not in s and 'Parse Error:'not in s"
      - name: Frozen pins, actual upper spells, production controls and exact restart
        if: github.event_name != 'workflow_dispatch' || !inputs.release
        env:
          UPPER_NATURE_ROOT: ${{ runner.temp }}/upper-nature-focused
        run: python tests/upper_nature/run-focused.py
      - name: Verified Windows export templates
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: python tools/release/prepare-templates.py
      - name: Complete native release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          UPPER_NATURE_RELEASE_ROOT: ${{ runner.temp }}/upper-nature-native
        run: python tests/upper_nature/verify-package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upper-nature-windows-evidence
          path: |
            ${{ runner.temp }}/upper-nature-focused/**
            ${{ runner.temp }}/upper-nature-native/**/*.json
            ${{ runner.temp }}/upper-nature-native/**/*.log
            ${{ runner.temp }}/upper-nature-native/captures/*.png
            ${{ runner.temp }}/upper-nature-import.log
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: upper-nature-complete-windows-x64
          path: ${{ runner.temp }}/upper-nature-native/distribution/*.zip*
          retention-days: 90
